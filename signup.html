
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Foodie Store</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BODY */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 20px 5%;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 15px;
            margin-bottom: 35px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-section img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .logo-section big {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .navbar nav a {
            color: #ccc;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .navbar nav a:hover {
            background: #444;
            color: white;
        }

        /* HEADING */
        h1 {
            text-align: center;
            font-size: 38px;
            margin-top: 30px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin: 12px 0 25px;
        }

        /* FORM */
        form {
            max-width: 450px;
            margin: 30px auto;
            padding: 35px;
            background: #222;
            border: 2px solid #444;
            border-radius: 25px;
        }

        /* LABELS */
        label {
            display: block;
            margin: 15px 0 7px;
            color: #ddd;
            font-weight: 600;
        }

        /* INPUTS */
        input {
            width: 100%;
            padding: 14px;
            background: #333;
            border: 1px solid #555;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #aaa;
            background: #3a3a3a;
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #555;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #eee;
            color: #111;
        }

        /* LOGIN LINK */
        .login-text {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }

        .login-text a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .navbar nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            form {
                padding: 25px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo-section">
            <a href="home.html">
                <img src="loogo.jpeg" alt="Foodie Logo">
            </a>

            <big>Best Food Store In Pakistan</big>
        </div>

        <nav>
            <a href="home.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="signup.html">SIGN UP</a>
            <a href="login.html">LOG IN</a>
        </nav>

    </header>

    <!-- SIGN UP -->
    <h1>Create Your Account</h1>

    <p class="subtitle">
        Join Foodie Store and enjoy delicious food!
    </p>

    <form id="signupForm">

        <label>Full Name</label>
        <input type="text" id="name"
            placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="email"
            placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone"
            placeholder="Enter your phone number" required>

        <label>Password</label>
        <input type="password" id="password"
            placeholder="Create a password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
            placeholder="Confirm your password" required>

        <button type="submit">CREATE ACCOUNT</button>

    </form>

    <p class="login-text">
        Already have an account?
        <a href="login.html">Log In</a>
    </p>

    <!-- JAVASCRIPT -->
    <script>

        document.getElementById("signupForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (name.length < 3) {
                alert("Please enter a valid name!");
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Please enter a valid email!");
                return;
            }

            if (!/^\d{10,15}$/.test(phone)) {
                alert("Please enter a valid phone number!");
                return;
            }

            if (password.length < 8) {
                alert("Password must be at least 8 characters!");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            alert("Registration successful!");

            window.location.href = "home.html";

        });

    </script>

</body>
</html>
