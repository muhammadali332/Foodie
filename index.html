<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #121212;
    color: #eeeeee;
    padding: 20px 5%;
    text-align: center;
}

/* LOGO */
body > a:first-child img {
    width: 85px;
    height: 85px;
    object-fit: contain;
    vertical-align: middle;
    margin-right: 15px;
}

/* STORE NAME */
big {
    display: inline-block;
    font-size: 25px;
    font-weight: 800;
    color: #ffffff;
    vertical-align: middle;
    margin-right: 30px;
}

/* NAVIGATION */
body > a {
    color: #cccccc;
    text-decoration: none;
}

body > a:not(:first-child) {
    display: inline-block;
    padding: 12px 18px;
    font-weight: 600;
    transition: 0.3s;
}

body > a:not(:first-child):hover {
    color: white;
    background: #333333;
    border-radius: 8px;
}

/* HORIZONTAL LINE */
hr {
    border: none;
    height: 1px;
    background: #444444;
    margin: 25px 0;
}

/* PRODUCTS TITLE */
h1 {
    font-size: 38px;
    color: #ffffff;
    margin: 35px 0;
}

/* PRODUCT GRID */
.product-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    margin: 30px 0;
}

/* PRODUCT CARDS */
.product-container .product {
    background: #222222;
    border: 2px solid #444444;
    border-radius: 25px;
    padding: 20px;
    transition: 0.3s ease;
}

/* CARD HOVER */
.product-container .product:hover {
    transform: translateY(-8px);
    border-color: #999999;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* PRODUCT NAMES */
h2 {
    font-size: 23px;
    color: #ffffff;
    margin-bottom: 15px;
}

/* PRODUCT IMAGES */
.product-container img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 18px;
    transition: 0.3s;
}

.product-container img:hover {
    transform: scale(1.03);
}

/* BUY NOW BUTTON */
.product-container a {
    display: inline-block;
    background: #444444;
    color: white;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 18px;
    transition: 0.3s;
}

.product-container a:hover {
    background: #eeeeee;
    color: #111111;
    transform: translateY(-3px);
}

/* RESPONSIVE */
@media (max-width: 700px) {
    .product-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 450px) {
    .product-container {
        grid-template-columns: 1fr;
    }

    big {
        font-size: 19px;
    }

    h1 {
        font-size: 30px;
    }
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 15px;
    margin-bottom: 25px;
}

/* LEFT SIDE */
.logo-section {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-section img {
    width: 75px;
    height: 75px;
    object-fit: contain;
}

.logo-section big {
    font-size: 22px;
    color: white;
    font-weight: bold;
    margin: 0;
}

/* RIGHT SIDE */
.navbar nav {
    display: flex;
    align-items: center;
    gap: 15px;
}

.navbar nav a {
    color: #ccc;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 15px;
    border-radius: 8px;
    transition: 0.3s;
}

.navbar nav a:hover {
    background: #444;
    color: white;
}

/* MOBILE */
@media (max-width: 700px) {
    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .navbar nav {
        flex-wrap: wrap;
        justify-content: center;
    }
}


</style>
</head>
<body>
    
<header class="navbar">

    <div class="logo-section">
        <a href="/HTML/Foodie/home.html">
            <img src="loogo.jpeg" alt="Foodie Logo" width="100" height="100">
        </a>

        <big>Best Food Store In Pakistan</big>
    </div>

    <nav>
        <a href="/HTML/Foodie/home.html">HOME</a>
        <a href="/HTML/Foodie/about.html">ABOUT</a>
        <a href="/HTML/Foodie/signup.html">SIGN UP</a>
        <a href="/HTML/Foodie/login.html">LOG IN</a>
    </nav>

</header>

    
<h1>Products</h1>
<hr>

<div class="product-container">

    <div class="product">
        <h2>Pizza</h2>
        <img src="/HTML/Foodie/pizza.jpeg" alt="Pizza">
        <a href="/buynow-pizza">BUY NOW</a>
    </div>

    <div class="product">
        <h2>Zinger Burger</h2>
        <img src="/HTML/Foodie/zberger.jpeg" alt="Zinger Burger">
        <a href="/buynow-zberger">BUY NOW</a>
    </div>

    <div class="product">
        <h2>Cake</h2>
        <img src="/HTML/Foodie/cake.jpeg" alt="Cake">
        <a href="/buynow-cake">BUY NOW</a>
    </div>

    <div class="product">
        <h2>Biryani</h2>
        <img src="/HTML/Foodie/birayani.jpeg" alt="Biryani">
        <a href="/buynow-biryani">BUY NOW</a>
    </div>

    <div class="product">
        <h2>French Fries</h2>
        <img src="/HTML/Foodie/ff.jpeg" alt="French Fries">
        <a href="/buynow-ff">BUY NOW</a>
    </div>

</div>

</body>
</body>
</html>
